<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/logo/AdvanceAnalytiklogo.png" />
  <link rel="stylesheet" href="/css/marketdata.css">
  <link rel="stylesheet" href="./market-css/sugar.css">
  <script src="../javascript/marketData.js"></script>
  <script src="../javascript/common.js" defer></script>
  <title>Analytical Solutions for Sugar Industry | Advance Analytik</title>
  <meta name="description" content="Advance Analytik provides specialized instrumentation services for the sugar industry, ensuring optimal quality control and operational efficiency. Transform your sugar production processes with our expert solutions today!">
</head>
<body>

    <div id="navbar-placeholder"></div>

    <div class="market">
    <div class="market__header" id="market-header"></div>

    <section class="market-map-graph-container">
      <div class="industry-map-detail-image-container">
        <img src="/images/market images/pulp-and-paper-detailed.webp" alt="Pulp and Paper Industry" width="1000" height="600">

        <!-- Highlight areas with arrows -->
        <div class="industry-map-detail-highlight" style="top: 20%; left: 30%; width: 100px; height: 50px;">
          <span class="industry-map-detail-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="industry-map-detail-hover-area" style="top: 20%; left: 32%;">Debarking Area</div>

        <div class="industry-map-detail-highlight" style="top: 35%; left: 45%; width: 120px; height: 60px;">
          <span class="industry-map-detail-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="industry-map-detail-hover-area" style="top: 35%; left: 47%;">Pulping Section</div>

        <div class="industry-map-detail-highlight" style="top: 50%; left: 60%; width: 140px; height: 70px;">
          <span class="industry-map-detail-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="industry-map-detail-hover-area" style="top: 50%; left: 62%;">Paper Machine Building</div>

        <div class="industry-map-detail-highlight" style="top: 65%; left: 75%; width: 90px; height: 50px;">
          <span class="industry-map-detail-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="industry-map-detail-hover-area" style="top: 65%; left: 77%;">Dryer Section</div>

        <div class="industry-map-detail-highlight" style="top: 80%; left: 15%; width: 110px; height: 60px;">
          <span class="industry-map-detail-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="industry-map-detail-hover-area" style="top: 80%; left: 17%;">Finishing Area</div>
      </div>

      </section>


    <div class="markets__sections__wrapper">
      <div class="markets__section__one" id="market-section-one"></div>
      <div class="markets__section__two">
        <img id="market-image" src="" alt="">
        <div class="markets__section__two__content__wrapper" id="market-section-two"></div>
      </div>
      <div class="market__des" id="market-des"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const route = "sugar";
      const market = marketData.find(m => m.route === route);

      if (market) {
        document.getElementById('market-header').innerHTML = `<h1>${market.name}</h1>`;
        document.getElementById('market-section-one').innerHTML = `<p>${market.des1}</p><p>${market.des2}</p>`;
        document.getElementById('market-image').src = market.img;
        document.getElementById('market-section-two').innerHTML = `<p>${market.des3}</p><a href="../products/analytical-instrumentation.html">View Products Range →</a>`;
        document.getElementById('market-des').innerHTML = `<p>${market.des4}</p>`;

            // Dynamically set the header background image for different pages
            document.querySelector('.market__header').style.backgroundImage = `url('${market.bgImg}')`;
      }
    });
  </script>

</body>
</html>
