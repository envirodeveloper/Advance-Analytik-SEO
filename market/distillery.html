<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/logo/AdvanceAnalytiklogo.png" />
  <link rel="stylesheet" href="/css/marketdata.css">
  <link rel="stylesheet" href="/market/market-css/distillery.css">
  <script src="../javascript/marketData.js"></script>
  <script src="../javascript/common.js" defer></script>
  <title>Analytical Solutions for Distilleries | Advance Analytik</title>
  <meta name="description" content=" Unlock efficiency in your distillery with Advance Analytik's cutting-edge analytical instrumentation. Enhance product quality and streamline operations with our tailored solutions for the distillation industry.">

</head>
<body>

    <div id="navbar-placeholder"></div>
  <div class="market">
    <div class="market__header" id="market-header"></div>

    <section class="market-map-graph-container">

      <div class="distillery-map">
        <img src="/images/market images/distillery-detailed.webp" alt="Distillery Industry" width="1000" height="600">
  
        <!-- Highlight areas with arrows -->
        <div class="distillery-map-highlight" style="top: 15%; left: 30%; width: 120px; height: 60px;">
          <span class="distillery-map-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="distillery-map-hover-area" style="top: 15%; left: 32%;">Fermentation Tanks</div>
  
        <div class="distillery-map-highlight" style="top: 35%; left: 45%; width: 150px; height: 70px;">
          <span class="distillery-map-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="distillery-map-hover-area" style="top: 35%; left: 47%;">Distillation Column</div>
  
        <div class="distillery-map-highlight" style="top: 50%; left: 60%; width: 140px; height: 70px;">
          <span class="distillery-map-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="distillery-map-hover-area" style="top: 50%; left: 62%;">Cooling Tower</div>
  
        <div class="distillery-map-highlight" style="top: 65%; left: 75%; width: 90px; height: 50px;">
          <span class="distillery-map-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="distillery-map-hover-area" style="top: 65%; left: 77%;">Storage Tanks</div>
  
        <div class="distillery-map-highlight" style="top: 80%; left: 15%; width: 110px; height: 60px;">
          <span class="distillery-map-arrow down" style="top: 0; left: 40%;"></span>
        </div>
        <div class="distillery-map-hover-area" style="top: 80%; left: 17%;">Packaging Area</div>
      </div>


    </section>
    <div class="markets__sections__wrapper">
      <div class="markets__section__one" id="market-section-one"></div>
      <div class="markets__section__two">
        <img id="market-image" src="" alt="">
        <div class="markets__section__two__content__wrapper" id="market-section-two"></div>
      </div>
      <div class="market__des" id="market-des"></div>
    </div>
  </div>

  <div id="footer-placeholder"></div>

  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const route = "distillery";
      const market = marketData.find(m => m.route === route);

      if (market) {
        document.getElementById('market-header').innerHTML = `<h1>${market.name}</h1>`;
        document.getElementById('market-section-one').innerHTML = `<p>${market.des1}</p><p>${market.des2}</p>`;
        document.getElementById('market-image').src = market.img;
        document.getElementById('market-section-two').innerHTML = `<p>${market.des3}</p><a href="../products/analytical-instrumentation.html">View Products Range →</a>`;
        document.getElementById('market-des').innerHTML = `<p>${market.des4}</p>`;

            // Dynamically set the header background image for different pages
            document.querySelector('.market__header').style.backgroundImage = `url('${market.bgImg}')`;
      }
    });
  </script>

</body>
</html>
