<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="../images/logo/AdvanceAnalytiklogo.png" />
  <link rel="stylesheet" href="/css/marketdata.css">
  <link rel="stylesheet" href="./market-css/pulp-and-paper.css">
  <script src="../javascript/marketData.js"></script>
  <script src="../javascript/common.js" defer></script>
  <title>Analytical Solutions for Pulp and Paper Industry | Advance Analytik</title>
  <meta name="description" content="Explore advanced analytical instrumentation solutions for the pulp and paper industry. Enhance quality control and production efficiency with Advance Analytik, your trusted analytical instrumentation provider in Hungary.">

</head>
<body>

  <div id="navbar-placeholder"></div>

  <div class="market">
    <div class="market__header" id="market-header"></div>
      
    <div class="markets__sections__wrapper">
      <div class="markets__section__one" id="market-section-one"></div>
      
      <section class="pulp-paper-map-graph-container">
        <div class="pulp-paper-map-detail-image-container">
          <img src="/images/market images/pulp-and-paper-detailed.webp" alt="Pulp and Paper Industry" width="1000" height="600">
      
          <!-- Highlight areas with text -->
          <div class="pulp-paper-map-detail-highlight" style="top: 20%; left: 30%; width: 100px; height: 50px;">
            <div class="pulp-paper-map-detail-text" style="top: -20px; left: 0;">Debarking Area</div>
          </div>
      
          <div class="pulp-paper-map-detail-highlight" style="top: 35%; left: 45%; width: 120px; height: 60px;">
            <div class="pulp-paper-map-detail-text" style="top: -20px; left: 0;">Pulping Section</div>
          </div>
      
          <div class="pulp-paper-map-detail-highlight" style="top: 50%; left: 60%; width: 140px; height: 70px;">
            <div class="pulp-paper-map-detail-text" style="top: -20px; left: 0;">Paper Machine Building</div>
          </div>
      
          <div class="pulp-paper-map-detail-highlight" style="top: 65%; left: 75%; width: 90px; height: 50px;">
            <div class="pulp-paper-map-detail-text" style="top: -20px; left: 0;">Dryer Section</div>
          </div>
      
          <div class="pulp-paper-map-detail-highlight" style="top: 80%; left: 15%; width: 110px; height: 60px;">
            <div class="pulp-paper-map-detail-text" style="top: -20px; left: 0;">Finishing Area</div>
          </div>
        </div>
      </section>

      <div class="markets__section__two">
        <img id="market-image" src="" alt="">
        <div class="markets__section__two__content__wrapper" id="market-section-two"></div>
      </div>
      <div class="market__des" id="market-des"></div>
    </div>
    
  </div>
 
  <div id="footer-placeholder"></div>




  <script>
    document.addEventListener("DOMContentLoaded", function() {
      const route = "pulpandpaper";  // This should dynamically reflect the route for the current page.
      const market = marketData.find(m => m.route === route);
  
      if (market) {
        document.getElementById('market-header').innerHTML = `<h1>${market.name}</h1>`;
        document.getElementById('market-section-one').innerHTML = `<p>${market.des1}</p><p>${market.des2}</p>`;
        document.getElementById('market-image').src = market.img;
        document.getElementById('market-section-two').innerHTML = `<p>${market.des3}</p><a href="../products/analytical-instrumentation.html">View Products Range →</a>`;
        document.getElementById('market-des').innerHTML = `<p>${market.des4}</p>`;
  
        // Dynamically set the header background image for different pages
        document.querySelector('.market__header').style.backgroundImage = `url('${market.bgImg}')`;
      }
    });
  </script>
  

</body>
</html>
