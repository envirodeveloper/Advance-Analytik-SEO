<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tanneries Industry Interactive Map</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
    }
    .container {
      position: relative;
      text-align: center;
    }
    img {
      max-width: 100%;
      height: auto;
    }
    .tooltip {
      position: absolute;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 8px 12px;
      border-radius: 5px;
      font-size: 14px;
      white-space: nowrap;
      visibility: hidden;
      transform: translate(-50%, -100%);
    }
    area:hover + .tooltip {
      visibility: visible;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Tanneries Image with Hotspots -->
    <img src="./images/market images/tanneries-detailed.webp" alt="Tanneries Industry" usemap="#tanneries-map">
    
    <!-- Tooltip Elements -->
    <div class="tooltip" style="top: 15%; left: 50%;">Chimneys - Emission Systems</div>
    <div class="tooltip" style="top: 40%; left: 10%;">Storage Tanks - Chemical Storage</div>
    <div class="tooltip" style="top: 50%; left: 50%;">Processing Area - Leather Treatment</div>
    <div class="tooltip" style="top: 85%; left: 20%;">Water Treatment Plant</div>
    <div class="tooltip" style="top: 70%; left: 80%;">Drying Area - Leather Rows</div>
  </div>

  <!-- Image Map Definition -->
  <map name="tanneries-map">
    <area shape="rect" coords="480,50,800,200" href="#" alt="Chimneys" title="Chimneys - Emission Systems">
    <area shape="circle" coords="150,300,100" href="#" alt="Storage Tanks" title="Storage Tanks - Chemical Storage">
    <area shape="rect" coords="400,400,800,600" href="#" alt="Processing Area" title="Processing Area - Leather Treatment">
    <area shape="rect" coords="100,700,300,850" href="#" alt="Water Treatment Plant" title="Water Treatment Plant">
    <area shape="rect" coords="700,600,1000,750" href="#" alt="Leather Drying Area" title="Drying Area - Leather Rows">
  </map>
</body>
</html>
